name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref — no point testing a PR twice
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs with zero npm installs — uses only Node's built-in assert module.
  # This job must always stay dependency-free so it can run instantly.
  server-bkt:
    name: BKT unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node server/lib/bkt.test.js

  # Lint the client. This catches broken imports and obvious errors before review.
  #
  # NON-BLOCKING (continue-on-error) until App.jsx is split up. `npm run lint`
  # currently reports ~750 pre-existing errors on main, almost all of them in
  # client/src/App.jsx (react-hooks/*, react-refresh/only-export-components).
  # While the job fails on every branch it tells a contributor nothing about
  # their own change, and a permanently red check trains everyone to ignore CI.
  #
  # The output is still produced and still worth reading — reviewers should
  # check that a PR does not ADD errors, which is easy to see by comparing the
  # count against main.
  #
  # Flip this back to blocking once the App.jsx backlog is cleared. Tracked by
  # the component-extraction epic #234.
  client-lint:
    name: Client lint
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint

  # Stops the lint baseline from becoming a dumping ground (#277).
  #
  # Client lint is green because every pre-existing violation is recorded in
  # client/eslint-suppressions.json. That only holds while the baseline stays
  # frozen: the moment someone silences a NEW violation with
  # `npx eslint . --suppress-all`, the lint job goes green and the defect ships.
  # The lint job cannot catch that on its own — a suppressed violation is, by
  # definition, invisible to it — so this job does.
  #
  # The baseline may shrink (you fixed something) but must never grow.
  # Dependency-free: Node built-ins only, so there is no `npm ci` here.
  #
  # pull_request only: a growing baseline should block the PR, not turn main red
  # after the fact.
  lint-baseline:
    name: Lint baseline guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the base commit's copy of the suppressions file is
          # available to compare against.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail if the lint baseline grew
        run: node .github/scripts/check-lint-baseline.js --base ${{ github.event.pull_request.base.sha }}

  # API contract tests — uses npm ci so CI fails if lockfile is out of sync.
  server-contract:
    name: API contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # MongoDB is needed by the Concept Playgrounds integration tests, which use a
    # scratch database and drop it afterwards. The topic contract tests do not
    # touch Mongo and are unaffected.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
